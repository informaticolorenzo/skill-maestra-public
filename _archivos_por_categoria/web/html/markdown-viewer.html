<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor Markdown - Skill Maestra</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f3460;
      --code-bg: #0b1220;
      --code-ink: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 0%, #e8f0ff 0%, var(--bg) 40%);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #1f2937;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: #f8fafc; border-color: #0f3460; }
    .btn.active { background: #0f3460; color: white; border-color: #0f3460; }

    .path {
      color: var(--muted);
      font-size: 0.88rem;
      white-space: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .wrap {
      max-width: var(--max-width, 1120px);
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .doc {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 34px;
      box-shadow: 0 8px 30px rgba(15, 52, 96, 0.08);
      font-size: var(--font-size, 1.05rem);
      line-height: 1.68;
    }

    h1, h2, h3, h4 {
      line-height: 1.25;
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      color: #0f172a;
    }

    h1 { font-size: 1.8rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
    h2 { font-size: 1.42rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.3rem; }
    h3 { font-size: 1.18rem; }

    p { margin: 0.85em 0; }
    ul, ol { margin: 0.75em 0 1em 1.5em; }
    li { margin: 0.42em 0; }

    code {
      background: #eef2ff;
      border: 1px solid #e0e7ff;
      border-radius: 6px;
      padding: 0.1em 0.35em;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9em;
    }

    pre {
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
      border: 1px solid #111827;
    }

    pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.88rem;
      line-height: 1.5;
      display: block;
    }

    blockquote {
      margin: 0.8em 0;
      padding: 0.6em 1em;
      border-left: 4px solid #93c5fd;
      background: #eff6ff;
      color: #1e3a8a;
      border-radius: 0 10px 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.92rem;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th { background: #f8fafc; }

    .error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .frontmatter {
      border: 1px solid #dbeafe;
      background: #f8fbff;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .frontmatter > summary {
      cursor: pointer;
      font-weight: 600;
      color: #0f3460;
      user-select: none;
      outline: none;
    }

    .frontmatter pre {
      margin-top: 10px;
      margin-bottom: 2px;
      max-height: 220px;
    }

    .mode-controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn" href="./index.html">← Volver al indice</a>
    <button class="btn" id="openRaw" type="button">Abrir .md original</button>
    <div class="mode-controls">
      <button class="btn active" id="modeCompact" title="Modo compacto">📄 Compacto</button>
      <button class="btn" id="modeAmple" title="Modo amplio">📖 Amplio</button>
    </div>
    <div class="path" id="filePath"></div>
  </div>

  <div class="wrap">
    <article class="doc" id="content">Cargando markdown...</article>
  </div>

  <script>
    let currentMode = 'compact';

    function setReadingMode(mode) {
      currentMode = mode;
      const doc = document.documentElement;
      const modeCompact = document.getElementById('modeCompact');
      const modeAmple = document.getElementById('modeAmple');

      if (mode === 'compact') {
        doc.style.setProperty('--max-width', '900px');
        doc.style.setProperty('--font-size', '0.98rem');
        modeCompact.classList.add('active');
        modeAmple.classList.remove('active');
      } else if (mode === 'ample') {
        doc.style.setProperty('--max-width', '1280px');
        doc.style.setProperty('--font-size', '1.12rem');
        modeCompact.classList.remove('active');
        modeAmple.classList.add('active');
      }
      localStorage.setItem('readingMode', mode);
    }

    function normalizePath(input) {
      return String(input || '').replace(/^\/+/, '').replace(/\\/g, '/');
    }

    function ensureSkillsPrefix(path) {
      const p = normalizePath(path);
      if (/^\.github\/skills\//i.test(p)) return p;
      if (/^[\w-]+\/SKILL\.md$/i.test(p)) return '.github/skills/' + p;
      return p;
    }

    function getWorkspaceRootFromViewerPath() {
      const pathname = decodeURIComponent(window.location.pathname || '');
      const marker = '/_archivos_por_categoria/web/html/markdown-viewer.html';
      const idx = pathname.toLowerCase().indexOf(marker.toLowerCase());
      if (idx === -1) return null;
      return pathname.slice(0, idx);
    }

    function toFileUrl(absPath) {
      const normalized = String(absPath || '').replace(/\\/g, '/');
      return 'file://' + (normalized.startsWith('/') ? normalized : '/' + normalized);
    }

    function escapeHtml(input) {
      return String(input)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderMarkdown(md) {
      let text = String(md || '').replace(/\r\n?/g, '\n');
      let frontmatterHtml = '';

      const fmMatch = text.match(/^---\n([\s\S]*?)\n---\n?/);
      if (fmMatch) {
        frontmatterHtml = '<details class="frontmatter"><summary>Metadatos de la skill</summary><pre><code>' +
          escapeHtml(fmMatch[1]) +
          '</code></pre></details>';
        text = text.slice(fmMatch[0].length);
      }

      text = text.replace(/```([\w-]*)\n([\s\S]*?)```/g, function (_m, lang, code) {
        const langClass = lang ? ' class="language-' + escapeHtml(lang) + '"' : '';
        return '<pre><code' + langClass + '>' + escapeHtml(code) + '</code></pre>';
      });

      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
      text = text.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
      text = text.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
      text = text.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
      text = text.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      text = text.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

      text = text.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');

      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      text = text.replace(/^(\s*[-*]\s.+(?:\n\s*[-*]\s.+)*)/gm, function (block) {
        const items = block
          .split('\n')
          .map(function (line) { return line.replace(/^\s*[-*]\s(.+)$/, '<li>$1</li>'); })
          .join('');
        return '<ul>' + items + '</ul>';
      });

      text = text.replace(/^(\s*\d+\.\s.+(?:\n\s*\d+\.\s.+)*)/gm, function (block) {
        const items = block
          .split('\n')
          .map(function (line) { return line.replace(/^\s*\d+\.\s(.+)$/, '<li>$1</li>'); })
          .join('');
        return '<ol>' + items + '</ol>';
      });

      text = text.split('\n\n').map(function (chunk) {
        const trimmed = chunk.trim();
        if (!trimmed) return '';
        if (/^<h[1-6]>|^<ul>|^<ol>|^<pre>|^<blockquote>|^<table>|^<hr/.test(trimmed)) return trimmed;
        if (/^---$/.test(trimmed)) return '<hr />';
        return '<p>' + trimmed.replace(/\n/g, '<br />') + '</p>';
      }).join('\n');

      text = text.replace(/\|(.+)\|/g, function(match) {
        const rows = match.split('\n').filter(r => r.trim());
        if (rows.length < 2) return match;
        
        let table = '<table><thead><tr>';
        const headers = rows[0].split('|').map(h => h.trim()).filter(h => h);
        headers.forEach(function(h) {
          table += '<th>' + h + '</th>';
        });
        table += '</tr></thead><tbody>';
        
        for (let i = 2; i < rows.length; i++) {
          if (rows[i].match(/^\s*[-:]+\s*$|^\||^\s+$/)) continue;
          table += '<tr>';
          const cells = rows[i].split('|').map(c => c.trim()).filter(c => c);
          cells.forEach(function(cell) {
            table += '<td>' + escapeHtml(cell) + '</td>';
          });
          table += '</tr>';
        }
        table += '</tbody></table>';
        return table;
      });

      return frontmatterHtml + text;
    }

    async function start() {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const content = document.getElementById('content');
      const filePath = document.getElementById('filePath');
      const openRaw = document.getElementById('openRaw');

      if (!file) {
        content.innerHTML = '<div class="error">Falta el parametro file en la URL.</div><div class="hint">Ejemplo: ?file=.github/skills/skill-creator/SKILL.md</div>';
        openRaw.disabled = true;
        return;
      }

      const normalized = ensureSkillsPrefix(file);
      filePath.textContent = normalized;

      openRaw.onclick = function () {
        const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
        const isFile = window.location.protocol === 'file:';
        
        if (isHttp) {
          window.location.href = '/' + normalized;
        } else if (isFile) {
          const root = getWorkspaceRootFromViewerPath();
          if (root) {
            window.location.href = toFileUrl(root + '/' + normalized);
          }
        }
      };

      try {
        let fetchUrl = '/' + normalized;
        let res = await fetch(fetchUrl, { cache: 'no-store' });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status} - No se encontró el archivo`);
        }

        const md = await res.text();
        content.innerHTML = renderMarkdown(md);
      } catch (err) {
        content.innerHTML = '<div class="error">❌ Error cargando archivo</div>' +
          '<div class="hint"><strong>Causa:</strong> ' + escapeHtml(err.message) + '</div>' +
          '<div class="hint"><strong>Ruta buscada:</strong> ' + escapeHtml('/' + normalized) + '</div>' +
          '<div class="hint"><strong>Protocolo:</strong> ' + window.location.protocol + '</div>' +
          '<p style="margin-top: 20px; font-size: 0.9rem; color: #666;">'+
          '<strong>🔧 Solución:</strong> Para que funcione correctamente, abre el servidor local con:<br/>' +
          '<code>cd &lt;carpeta del repositorio&gt;</code><br/>' +
          '<code>.\\open-skill-maestra-web.ps1</code>' +
          '</p>';
      }
    }

    start();

    document.getElementById('modeCompact').addEventListener('click', () => setReadingMode('compact'));
    document.getElementById('modeAmple').addEventListener('click', () => setReadingMode('ample'));

    const savedMode = localStorage.getItem('readingMode') || 'compact';
    setReadingMode(savedMode);
  </script>
</body>
</html>
